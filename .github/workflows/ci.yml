name: CI

# FR-010: lint, typecheck, test, and build are reported INDEPENDENTLY on every PR — an
# `if: '!cancelled()'` guard on each step means one failure doesn't hide the others behind it
# (research R8). No PRODUCTION migration step exists in this file, anywhere (FR-012, Article 32
# [NN], spec edge case) — a real environment is migrated only by migrate.yml, which nothing here
# triggers.
#
# 002-content-schema-seed (research R13, T006): added the `postgres` service container below,
# plus the "Generate Prisma client" and "Migrate test database" steps. Layers 2 and 3 of this
# feature's tests (migration + seed) need a live, migrated database and a generated client, and
# would otherwise never run in CI. "Migrate test database" runs `prisma migrate deploy` — applies
# the already-committed migration file, generates nothing (contracts/db-commands.md: "CI never
# generates migrations") — against this ephemeral, throwaway container. Still no automatic
# production migration (Article 32 [NN]): that database is never reachable from this job.
#
# 003-auth-authorization: added the `redis` service container. The HTTP-level auth/permissions
# suites build a real app (`buildApp(loadEnv())`), which needs env.ts's FULL schema satisfied,
# not just DATABASE_URL — REDIS_URL for real rate-limit tests (the shared 5/min/IP budget is
# genuinely exercised, not just present-but-unused), the two auth secrets, and S3_*/CORS_ORIGINS
# purely to satisfy Zod (nothing in `buildApp()` itself contacts S3 — `lib/health.ts`'s boot
# check is a separate code path this test suite never calls). None of these values are secrets
# worth protecting — they're throwaway, ephemeral-container credentials, same posture as the
# Postgres ones above.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pascca
          POSTGRES_PASSWORD: pascca
          POSTGRES_DB: pascca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pascca -d pascca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Article 5 [NN]: Node 22 LTS, sourced from the same .nvmrc a developer uses locally —
          # one pin, not a CI-only duplicate that could drift from it.
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json # resolves the pinned version from "packageManager"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck and Test both import generated Prisma Client types/runtime
      # (`@prisma/client`); neither exists until this runs. `prisma generate` reads only
      # schema.prisma — no DB contact — but Prisma still resolves `env("DATABASE_URL")` while
      # validating the schema, so the var must be present even here.
      - name: Generate Prisma client
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql://pascca:pascca@localhost:5432/pascca
        run: pnpm --filter @pascca/api db:generate

      # Each step below runs even if an earlier one failed (!cancelled()), so a lint error
      # doesn't hide a typecheck error — FR-010's "reported individually" requirement.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      # 004-web-design-system-port (FR-005, research R3): catches a raw hex/rgba/px-radius/
      # cubic-bezier literal outside packages/config/tokens.css — including in .css files,
      # which the ESLint step above never parses.
      - name: Check hex literals
        if: ${{ !cancelled() }}
        run: node scripts/check-hex-literals.mjs apps/web apps/admin

      # `migrate deploy`, not `migrate dev` — applies the committed migration file as-is and
      # never generates a new one (contracts/db-commands.md). Same command migrate.yml uses
      # against production; here it targets only the ephemeral `services.postgres` above.
      - name: Migrate test database
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: postgresql://pascca:pascca@localhost:5432/pascca
        run: pnpm --filter @pascca/api exec prisma migrate deploy

      - name: Test
        if: ${{ !cancelled() }}
        env:
          # Test-step only, as R13/T006 require. This never reaches migrate.yml or a real
          # environment — it is the ephemeral `services.postgres`/`services.redis` above.
          DATABASE_URL: postgresql://pascca:pascca@localhost:5432/pascca
          REDIS_URL: redis://localhost:6379
          # 003-auth-authorization: satisfies env.ts's schema for buildApp()-based tests. Not
          # real secrets — throwaway values scoped to this ephemeral job.
          JWT_ACCESS_SECRET: ci-only-jwt-access-secret-not-a-real-secret-32chars
          COOKIE_SECRET: ci-only-cookie-secret-not-a-real-secret-32-characters
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ci-placeholder
          S3_SECRET_ACCESS_KEY: ci-placeholder
          S3_BUCKET: ci-placeholder
          CORS_ORIGINS: http://localhost:3000
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # 004-web-design-system-port (T105, Article 30's a11y risk row, SC-005/SC-006): a11y and
      # Lighthouse audits need a real running production build, not the dev server — the same
      # `pnpm build` (just ran above) + `pnpm start` pairing quickstart.md and a developer both
      # use locally.
      - name: Install Playwright browsers
        if: ${{ !cancelled() }}
        run: pnpm --filter @pascca/web exec playwright install --with-deps chromium

      - name: Start production server
        if: ${{ !cancelled() }}
        run: pnpm --filter @pascca/web start &

      - name: Wait for production server
        if: ${{ !cancelled() }}
        run: npx wait-on http://localhost:3000/en --timeout 60000

      - name: Playwright a11y audit
        if: ${{ !cancelled() }}
        run: pnpm --filter @pascca/web exec playwright test tests/a11y

      - name: Lighthouse thresholds (SC-006)
        if: ${{ !cancelled() }}
        run: node apps/web/scripts/lighthouse-check.mjs
