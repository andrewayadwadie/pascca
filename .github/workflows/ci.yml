name: CI

# FR-010: lint, typecheck, test, and build are reported INDEPENDENTLY on every PR — an
# `if: '!cancelled()'` guard on each step means one failure doesn't hide the others behind it
# (research R8). No migration step exists in this file, anywhere (FR-012, Article 32 [NN],
# spec edge case) — migrations live only in migrate.yml, which nothing here triggers.
#
# 002-content-schema-seed (research R13, T006): added the `postgres` service container below,
# for the Test step ONLY. Layers 2 and 3 of this feature's tests (migration + seed) need a live
# database and would otherwise never run in CI. Nothing here applies a migration — the Test step
# runs `prisma migrate dev` itself, the same as a developer would locally, against this
# ephemeral, throwaway database. Still no automatic production migration (Article 32 [NN]).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pascca
          POSTGRES_PASSWORD: pascca
          POSTGRES_DB: pascca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pascca -d pascca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Article 5 [NN]: Node 22 LTS, sourced from the same .nvmrc a developer uses locally —
          # one pin, not a CI-only duplicate that could drift from it.
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json # resolves the pinned version from "packageManager"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each step below runs even if an earlier one failed (!cancelled()), so a lint error
      # doesn't hide a typecheck error — FR-010's "reported individually" requirement.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        env:
          # Test-step only, as R13/T006 require. This never reaches migrate.yml or a real
          # environment — it is the ephemeral `services.postgres` container above.
          DATABASE_URL: postgresql://pascca:pascca@localhost:5432/pascca
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build
